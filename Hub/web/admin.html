<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DriveLink Hub</title>
<link rel="stylesheet" href="/admin/vendor/leaflet.css">
<style>
  :root { --bg:#14171a; --panel:#1d2126; --line:#2c323a; --text:#e6e8eb; --dim:#9aa3ad; --accent:#4fb3ff; --zone:#ff8a3d; --arr:#45d483; --bad:#ff5d5d; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, Segoe UI, sans-serif; }
  #top { height:44px; display:flex; align-items:center; gap:6px; padding:0 12px; background:var(--panel); border-bottom:1px solid var(--line); }
  #top b { margin-right:10px; }
  #top .badge { background:var(--accent); color:#06121c; border-radius:9px; padding:0 6px; font-size:11px; margin-left:4px; }
  #app { display:flex; height:calc(100% - 44px); }
  #page { height:calc(100% - 44px); overflow:auto; padding:18px; }
  #page .wrap { max-width:920px; margin:0 auto; }
  #page h2.big { font-size:18px; margin:4px 0 10px; color:var(--text); text-transform:none; letter-spacing:0; }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:7px 6px; border-bottom:1px solid var(--line); font-size:13px; }
  th { color:var(--dim); font-weight:normal; }
  tr.click { cursor:pointer; } tr.click:hover, tr.click.sel { background:#262b31; }
  .ok { color:var(--arr); } .warn { color:#ffcc4d; } .badtxt { color:var(--bad); }
  code, pre { font:12px/1.45 Consolas, monospace; background:#0f1215; border:1px solid var(--line); border-radius:6px; }
  code { padding:1px 5px; } pre { padding:8px 10px; white-space:pre-wrap; word-break:break-all; margin:6px 0; }
  .copy { float:right; font-size:12px; padding:3px 8px; margin:-2px 0 0 8px; }
  .grid3 { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:700px) { .grid3, .grid2 { grid-template-columns:1fr; } }
  .btns { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  button.primary { background:var(--accent); color:#06121c; border-color:var(--accent); }
  #side { width:340px; min-width:300px; background:var(--panel); border-right:1px solid var(--line); overflow:auto; padding:14px; }
  #map { flex:1; background:#0b0d0f; }
  h1 { font-size:16px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:12px; }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .tab { padding:6px 10px; border:1px solid var(--line); border-radius:6px; cursor:pointer; background:transparent; color:var(--text); }
  .tab.on, .nav.on { border-color:var(--accent); color:var(--accent); background:transparent; }
  .nav { padding:6px 10px; border:1px solid var(--line); border-radius:6px; cursor:pointer; background:transparent; color:var(--text); }
  .tools { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:8px 0 12px; }
  button { font:inherit; padding:7px 10px; border-radius:6px; border:1px solid var(--line); background:#262b31; color:var(--text); cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.on { background:var(--accent); color:#06121c; border-color:var(--accent); }
  button.danger { color:var(--bad); }
  .box { border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:12px; }
  .box h2 { font-size:13px; margin:0 0 8px; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; }
  label { display:block; font-size:12px; color:var(--dim); margin:6px 0 2px; }
  input, select { width:100%; font:inherit; padding:6px 8px; border-radius:6px; border:1px solid var(--line); background:#14171a; color:var(--text); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .item { display:flex; justify-content:space-between; align-items:center; padding:5px 6px; border-radius:6px; cursor:pointer; }
  .item:hover, .item.sel { background:#262b31; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:6px; }
  .status { font-size:12px; color:var(--dim); min-height:16px; }
  .hint { font-size:12px; color:var(--dim); }
  .arrow-icon { width:28px; height:28px; }
  .handle { width:14px; height:14px; border-radius:50%; background:#fff; border:3px solid var(--accent); }
  .leaflet-container { background:#0b0d0f; }
  .lbl { background:rgba(0,0,0,.65); color:#fff; border:none; box-shadow:none; font-size:12px; }
  .lbl:before { display:none; }
</style>
</head>
<body>
<div id="top">
  <b>DriveLink Hub</b>
  <button class="nav tab-nav" data-view="servers">Servers<span id="pendBadge"></span></button>
  <button class="nav tab-nav" data-view="players">Players</button>
  <button class="nav tab-nav" data-view="map">Map</button>
  <button class="nav tab-nav" data-view="setup">Setup</button>
</div>
<div id="page" style="display:none"><div class="wrap" id="pageBody"></div></div>
<div id="app">
  <div id="side">
    <h1>Map</h1>
    <div class="sub">Leaving zones and arrival points. Changes are saved at once and reach the DayZ server within ~30 s. Heights come from the terrain.</div>
    <div class="tabs" id="tabs"></div>
    <div class="box" id="mapbox"></div>
    <div class="tools">
      <button id="tZone" title="Click the centre, drag out the radius">+ Leaving zone</button>
      <button id="tArr" title="Click the spot, drag the way they face">+ Arrival point</button>
    </div>
    <div class="hint" id="toolHint">Pick a tool, or click a zone / point on the map to edit it.</div>
    <div class="box" id="edit" style="display:none"></div>
    <div class="box"><h2>Leaving zones</h2><div id="zlist"></div></div>
    <div class="box"><h2>Arrival points</h2><div id="alist"></div></div>
    <div class="status" id="status"></div>
  </div>
  <div id="map"></div>
</div>
<script src="/admin/vendor/leaflet.js"></script>
<script>
"use strict";
const SIZES = { chernarusplus: 15360, enoch: 12800, sakhal: 15360 };
let S = null, cur = null, map = null, tiles = null, layer = null, tool = null, sel = null, saveTimer = null, drawing = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const srv = () => S.servers.find(s => s.id === cur);
const L_of = s => s.layout;


function setStatus(t, bad) { const e = $("status"); e.textContent = t; e.style.color = bad ? "var(--bad)" : ""; }

function render(rebuildMap) {
  $("tabs").innerHTML = S.servers.map(s => `<button class="tab ${s.id === cur ? "on" : ""}" data-id="${esc(s.id)}">${esc(s.name)}</button>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { cur = b.dataset.id; sel = null; render(true); });
  renderMapBox();
  if (rebuildMap) buildMap();
  drawLayout();
  renderLists();
  renderEdit();
}

function renderMapBox() {
  const s = srv(), m = S.maps[s.map] || {};
  const opts = Object.keys(S.maps).map(k => `<option value="${esc(k)}" ${k === s.map ? "selected" : ""}>${esc(k)}</option>`).join("");
  let line;
  if (m.meta) line = `Map ready (${Math.round(m.meta.size)} m).`;
  else if (m.status && !/^(ready|FAILED)/.test(m.status)) line = `Building: ${esc(m.status)}`;
  else if (m.inGameFiles && S.tools) line = `No map image yet. <button id="build">Build from game files</button>`;
  else if (m.inGameFiles) line = `DayZ Tools not found (install it from Steam).`;
  else line = `No game files for this map found - a grid is shown.`;
  if (m.status && /^FAILED/.test(m.status)) line += `<div style="color:var(--bad)">${esc(m.status)}</div>`;
  $("mapbox").innerHTML = `<h2>Map</h2><select id="mapSel">${opts || `<option>${esc(s.map || "?")}</option>`}</select><div class="hint" style="margin-top:6px">${line}</div>`;
  $("mapSel").onchange = e => { s.map = e.target.value; save(); render(true); };
  const b = $("build");
  if (b) b.onclick = async () => { await fetch(`/admin/api/maps/${encodeURIComponent(s.map)}/build`, { method: "POST" }); pollBuild(); };
}

function pollBuild() {
  const s = srv();
  setTimeout(async () => {
    const r = await fetch("/admin/api/state", { cache: "no-store" });
    const n = await r.json();
    S.maps = n.maps;
    const m = S.maps[s.map] || {};
    renderMapBox();
    if (m.meta) buildMap(); else if (m.status && !/^(ready|FAILED)/.test(m.status)) pollBuild();
    if (m.meta) drawLayout();
  }, 1500);
}

function buildMap() {
  const s = srv(), m = S.maps[s.map] || {};
  const size = (m.meta && m.meta.size) || SIZES[s.map] || 15360;
  if (map) { map.remove(); map = null; }
  const crs = L.extend({}, L.CRS.Simple, { transformation: new L.Transformation(1, 0, -1, size) });
  map = L.map("map", { crs, minZoom: m.meta ? m.meta.minZoom : -6, maxZoom: 3, zoomSnap: 0.25, attributionControl: false, boxZoom: false });
  const bounds = [[0, 0], [size, size]];
  if (m.meta) {
    tiles = L.tileLayer(`/admin/maps/${encodeURIComponent(s.map)}/{z}/{x}_{y}.jpg`, { tileSize: m.meta.tileSize, minNativeZoom: m.meta.minZoom, maxNativeZoom: 0, minZoom: m.meta.minZoom, maxZoom: 3, noWrap: true, bounds }).addTo(map);
  } else {
    const g = [];
    for (let v = 0; v <= size; v += 1000) { g.push([[v, 0], [v, size]]); g.push([[0, v], [size, v]]); }
    L.polyline(g, { color: "#2c323a", weight: 1, interactive: false }).addTo(map);
  }
  L.rectangle(bounds, { color: "#3a414a", weight: 1, fill: false, interactive: false }).addTo(map);
  map.fitBounds(bounds);
  const pos = L.control({ position: "bottomleft" });
  pos.onAdd = () => { const d = L.DomUtil.create("div", "lbl leaflet-tooltip"); d.id = "pos"; d.style.position = "static"; return d; };
  pos.addTo(map);
  map.on("mousemove", e => { const p = $("pos"); if (p) p.textContent = `x ${e.latlng.lng.toFixed(1)}   z ${e.latlng.lat.toFixed(1)}`; });
  map.on("mousedown", startDraw);
  map.on("mousemove", moveDraw);
  map.on("mouseup", endDraw);
  layer = L.layerGroup().addTo(map);
}

// ---------- drawing ----------
const yawOf = (from, to) => ((Math.atan2(to.lng - from.lng, to.lat - from.lat) * 180 / Math.PI) + 360) % 360;
const dist = (a, b) => Math.hypot(a.lng - b.lng, a.lat - b.lat);
const otherServers = () => S.servers.filter(s => s.id !== cur);

function setTool(t) {
  tool = tool === t ? null : t;
  $("tZone").classList.toggle("on", tool === "zone");
  $("tArr").classList.toggle("on", tool === "arr");
  $("toolHint").textContent = tool === "zone" ? "Click the centre of the zone and drag out its radius." : tool === "arr" ? "Click where players arrive and drag the way they face." : "Pick a tool, or click a zone / point on the map to edit it.";
  if (map) tool ? map.dragging.disable() : map.dragging.enable();
}
$("tZone").onclick = () => setTool("zone");
$("tArr").onclick = () => setTool("arr");

function startDraw(e) {
  if (!tool) return;
  drawing = { kind: tool, start: e.latlng, shape: null };
  if (tool === "zone") drawing.shape = L.circle(e.latlng, { radius: 1, color: "#ff8a3d" }).addTo(map);
  else drawing.shape = L.polyline([e.latlng, e.latlng], { color: "#45d483", weight: 3 }).addTo(map);
}
function moveDraw(e) {
  if (!drawing) return;
  if (drawing.kind === "zone") drawing.shape.setRadius(Math.max(1, dist(drawing.start, e.latlng)));
  else drawing.shape.setLatLngs([drawing.start, e.latlng]);
}
function endDraw(e) {
  if (!drawing) return;
  const d = drawing; drawing = null; map.removeLayer(d.shape);
  const L1 = L_of(srv());
  if (d.kind === "zone") {
    const to = otherServers()[0];
    const toArr = to && to.layout.arrivals[0];
    const z = { name: `To ${to ? to.name : "?"}`, center: [d.start.lng, 0, d.start.lat], radius: Math.max(5, Math.round(dist(d.start, e.latlng))), to: to ? to.id : "", arrival: toArr ? toArr.name : "" };
    L1.zones.push(z); sel = { kind: "zone", i: L1.zones.length - 1 };
  } else {
    const yaw = dist(d.start, e.latlng) > 1 ? yawOf(d.start, e.latlng) : 0;
    const a = { name: `arrival_${L1.arrivals.length + 1}`, pos: [d.start.lng, 0, d.start.lat], yaw: Math.round(yaw), carPos: [0, 0, 0], carYaw: 0 };
    L1.arrivals.push(a); sel = { kind: "arr", i: L1.arrivals.length - 1 };
  }
  setTool(null);
  save(); drawLayout(); renderLists(); renderEdit();
}

// ---------- show the layout ----------
function arrowIcon(yaw, color) {
  return L.divIcon({ className: "", iconSize: [28, 28], iconAnchor: [14, 14],
    html: `<svg class="arrow-icon" viewBox="0 0 28 28" style="transform:rotate(${yaw}deg)"><circle cx="14" cy="14" r="6" fill="${color}" stroke="#000" stroke-width="1.5"/><path d="M14 1 L19 10 L9 10 Z" fill="${color}" stroke="#000" stroke-width="1"/></svg>` });
}
const handleIcon = L.divIcon({ className: "", iconSize: [14, 14], iconAnchor: [7, 7], html: `<div class="handle"></div>` });

function drawLayout() {
  if (!layer) return;
  layer.clearLayers();
  const L1 = L_of(srv());
  L1.zones.forEach((z, i) => {
    const on = sel && sel.kind === "zone" && sel.i === i;
    const c = L.circle([z.center[2], z.center[0]], { radius: z.radius, color: "#ff8a3d", weight: on ? 3 : 2, fillOpacity: on ? .25 : .15 }).addTo(layer);
    c.bindTooltip(`${esc(z.name)} → ${esc(z.to)}`, { permanent: true, direction: "center", className: "lbl" });
    c.on("click", ev => { if (tool) return; L.DomEvent.stop(ev); sel = { kind: "zone", i }; drawLayout(); renderLists(); renderEdit(); });
    if (on) {
      const ctr = L.marker([z.center[2], z.center[0]], { draggable: true, icon: handleIcon }).addTo(layer);
      const rad = L.marker([z.center[2], z.center[0] + z.radius], { draggable: true, icon: handleIcon }).addTo(layer);
      ctr.on("drag", e => { const p = e.target.getLatLng(); c.setLatLng(p); rad.setLatLng([p.lat, p.lng + z.radius]); });
      ctr.on("dragend", e => { const p = e.target.getLatLng(); z.center = [p.lng, 0, p.lat]; save(); renderEdit(); drawLayout(); });
      rad.on("drag", e => c.setRadius(Math.max(1, dist(c.getLatLng(), e.target.getLatLng()))));
      rad.on("dragend", e => { z.radius = Math.max(1, Math.round(dist(c.getLatLng(), e.target.getLatLng()))); save(); renderEdit(); drawLayout(); });
    }
  });
  L1.arrivals.forEach((a, i) => {
    const on = sel && sel.kind === "arr" && sel.i === i;
    const ll = [a.pos[2], a.pos[0]];
    const m = L.marker(ll, { icon: arrowIcon(a.yaw, "#45d483"), draggable: on, zIndexOffset: 500 }).addTo(layer);
    m.bindTooltip(esc(a.name), { permanent: true, direction: "right", offset: [12, 0], className: "lbl" });
    m.on("click", ev => { if (tool) return; L.DomEvent.stop(ev); sel = { kind: "arr", i }; drawLayout(); renderLists(); renderEdit(); });
    if (on) {
      const r = Math.max(15, 2 ** (-map.getZoom()) * 40);
      const rad = a.yaw * Math.PI / 180;
      const head = L.marker([a.pos[2] + Math.cos(rad) * r, a.pos[0] + Math.sin(rad) * r], { draggable: true, icon: handleIcon }).addTo(layer);
      const line = L.polyline([ll, head.getLatLng()], { color: "#45d483", weight: 2, dashArray: "4 4", interactive: false }).addTo(layer);
      m.on("drag", e => line.setLatLngs([e.target.getLatLng(), head.getLatLng()]));
      m.on("dragend", e => { const p = e.target.getLatLng(); a.pos = [p.lng, a.pos[1], p.lat]; save(); renderEdit(); drawLayout(); });
      head.on("drag", e => { line.setLatLngs([m.getLatLng(), e.target.getLatLng()]); m.setIcon(arrowIcon(yawOf(m.getLatLng(), e.target.getLatLng()), "#45d483")); });
      head.on("dragend", e => { a.yaw = Math.round(yawOf(m.getLatLng(), e.target.getLatLng())); save(); renderEdit(); drawLayout(); });
    }
  });
}

function renderLists() {
  const L1 = L_of(srv());
  $("zlist").innerHTML = L1.zones.map((z, i) => `<div class="item ${sel && sel.kind === "zone" && sel.i === i ? "sel" : ""}" data-k="zone" data-i="${i}"><span><span class="dot" style="background:var(--zone)"></span>${esc(z.name)}</span><span class="hint">r ${Math.round(z.radius)} m → ${esc(z.to)}${z.distanceKm ? `, ${Math.round(z.distanceKm)} km` : ""}</span></div>`).join("") || `<div class="hint">none yet</div>`;
  $("alist").innerHTML = L1.arrivals.map((a, i) => `<div class="item ${sel && sel.kind === "arr" && sel.i === i ? "sel" : ""}" data-k="arr" data-i="${i}"><span><span class="dot" style="background:var(--arr)"></span>${esc(a.name)}</span><span class="hint">${Math.round(a.yaw)}°</span></div>`).join("") || `<div class="hint">none yet</div>`;
  document.querySelectorAll(".item").forEach(el => el.onclick = () => {
    sel = { kind: el.dataset.k, i: +el.dataset.i };
    const L2 = L_of(srv()), o = sel.kind === "zone" ? L2.zones[sel.i] : L2.arrivals[sel.i];
    const p = sel.kind === "zone" ? o.center : o.pos;
    map.setView([p[2], p[0]], Math.max(map.getZoom(), -1));
    drawLayout(); renderLists(); renderEdit();
  });
}

function renderEdit() {
  const box = $("edit");
  if (!sel) { box.style.display = "none"; return; }
  const L1 = L_of(srv());
  box.style.display = "";
  if (sel.kind === "zone") {
    const z = L1.zones[sel.i];
    if (!z) { sel = null; return renderEdit(); }
    const target = S.servers.find(s => s.id === z.to);
    const arrs = target ? target.layout.arrivals : [];
    box.innerHTML = `<h2>Leaving zone</h2>
      <label>Name (shown to players)</label><input id="fName" value="${esc(z.name)}">
      <div class="row"><div><label>x</label><input id="fX" type="number" step="0.1" value="${z.center[0].toFixed(1)}"></div><div><label>z</label><input id="fZ" type="number" step="0.1" value="${z.center[2].toFixed(1)}"></div></div>
      <div class="row"><div><label>Radius (m)</label><input id="fR" type="number" min="1" value="${Math.round(z.radius)}"></div>
      <div><label>Trip distance (km, 0 = free + instant)</label><input id="fKm" type="number" min="0" step="1" value="${Math.round(z.distanceKm || 0)}"></div></div>
      <div class="hint" id="fCost">${tripCost(z)}</div>
      <label>Sends players to</label><select id="fTo">${otherServers().map(s => `<option value="${esc(s.id)}" ${s.id === z.to ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select>
      <label>Arrival point there</label><select id="fArr">${arrs.map(a => `<option ${a.name === z.arrival ? "selected" : ""}>${esc(a.name)}</option>`).join("")}${arrs.length ? "" : `<option value="">(that server has no arrival points yet)</option>`}</select>
      <div style="margin-top:10px"><button class="danger" id="fDel">Delete zone</button></div>`;
    $("fName").oninput = e => { z.name = e.target.value; changed(); };
    $("fX").onchange = e => { z.center[0] = +e.target.value; changed(true); };
    $("fZ").onchange = e => { z.center[2] = +e.target.value; changed(true); };
    $("fR").onchange = e => { z.radius = Math.max(1, +e.target.value); changed(true); };
    $("fKm").onchange = e => { z.distanceKm = Math.max(0, +e.target.value || 0); $("fCost").innerHTML = tripCost(z); changed(); };
    $("fTo").onchange = e => { z.to = e.target.value; const t = S.servers.find(s => s.id === z.to); z.arrival = t && t.layout.arrivals[0] ? t.layout.arrivals[0].name : ""; changed(true); renderEdit(); };
    $("fArr").onchange = e => { z.arrival = e.target.value; changed(); };
    $("fDel").onclick = () => { L1.zones.splice(sel.i, 1); sel = null; changed(true); };
  } else {
    const a = L1.arrivals[sel.i];
    if (!a) { sel = null; return renderEdit(); }
    box.innerHTML = `<h2>Arrival point</h2>
      <label>Name (zones on other servers point here)</label><input id="fName" value="${esc(a.name)}">
      <div class="row"><div><label>x</label><input id="fX" type="number" step="0.1" value="${a.pos[0].toFixed(1)}"></div><div><label>z</label><input id="fZ" type="number" step="0.1" value="${a.pos[2].toFixed(1)}"></div></div>
      <label>Facing (degrees, 0 = north, 90 = east)</label><input id="fYaw" type="number" min="0" max="359" value="${Math.round(a.yaw)}">
      <div class="hint" style="margin-top:6px">A car that comes along is built here facing the same way; the driver stands 3 m to its left.</div>
      <div style="margin-top:10px"><button class="danger" id="fDel">Delete point</button></div>`;
    $("fName").oninput = e => { renameArrival(a, e.target.value); changed(); };
    $("fX").onchange = e => { a.pos[0] = +e.target.value; changed(true); };
    $("fZ").onchange = e => { a.pos[2] = +e.target.value; changed(true); };
    $("fYaw").onchange = e => { a.yaw = ((+e.target.value % 360) + 360) % 360; changed(true); };
    $("fDel").onclick = () => { L1.arrivals.splice(sel.i, 1); sel = null; changed(true); };
  }
}

// what a trip through this zone costs, by the rules of the server it starts on (Servers page, Travel)
function tripCost(z) {
  const km = z.distanceKm || 0, t = srv().travel;
  if (!km) return "Free and instant (no distance set).";
  if (!t) return "";
  const k = km / 10, r = v => Math.round(v * k);
  const time = mins => mins >= 60 ? `${Math.floor(mins / 60)} h ${Math.round(mins % 60)} min` : `${Math.round(mins)} min`;
  return `On foot: ${r(t.foodFootPct)}% food, ${r(t.waterFootPct)}% water${t.timeEnabled ? `, ${time(km / t.speedFootKmh * 60)}` : ""}.<br>By car: ${r(t.foodCarPct)}% food, ${r(t.waterCarPct)}% water each, ${r(t.fuelLiters)} L fuel, wear engine ${r(t.wearEnginePct)}% / wheels ${r(t.wearWheelsPct)}%${t.timeEnabled ? `, ${time(km / t.speedCarKmh * 60)}` : ""}.<br><span class="hint">Rules: ${esc(srv().name)}'s Travel settings (Servers page), ${t.mode === "weakened" ? "arrive weakened" : "refuse when short"}. Not charged yet in game (next build step).</span>`;
}

// renaming an arrival point also fixes the zones on other servers that send players to it
let renameFrom = null;
function renameArrival(a, name) { renameFrom = renameFrom === null ? a.name : renameFrom; a.name = name; }

function changed(redraw) { save(); if (redraw) { drawLayout(); } renderLists(); }

function save() {
  clearTimeout(saveTimer);
  setStatus("Saving…");
  saveTimer = setTimeout(async () => {
    const s = srv(), list = [s];
    if (renameFrom !== null) {
      const newName = sel && sel.kind === "arr" ? L_of(s).arrivals[sel.i].name : null;
      S.servers.forEach(o => { if (o.id === s.id) return; let hit = false; o.layout.zones.forEach(z => { if (z.to === s.id && z.arrival === renameFrom && newName) { z.arrival = newName; hit = true; } }); if (hit) list.push(o); });
      renameFrom = null;
    }
    try {
      for (const t of list) {
        const r = await fetch(`/admin/api/layout/${encodeURIComponent(t.id)}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ map: t.map, zones: t.layout.zones, arrivals: t.layout.arrivals }) });
        if (!r.ok) throw new Error(await r.text());
        t.layout.rev = (await r.json()).rev;
      }
      setStatus(`Saved (rev ${s.layout.rev}). ${s.name} picks it up within ~30 s.`);
    } catch (e) { setStatus("Save failed: " + e.message, true); }
  }, 400);
}

// ---------- views: Servers | Map | Setup ----------
let view = null, editing = null, fw = null, showKey = false;
const ago = s => s == null ? null : s < 90 ? "online" : s < 3600 ? `last seen ${Math.round(s / 60)} min ago` : s < 86400 ? `last seen ${Math.round(s / 3600)} h ago` : `last seen ${Math.round(s / 86400)} d ago`;
const post = async (url, body) => {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: body === undefined ? "{}" : JSON.stringify(body) });
  const t = await r.text();
  if (!r.ok) throw new Error(t);
  try { return JSON.parse(t); } catch { return {}; }
};
const copyBtn = text => `<button class="copy" data-copy="${esc(text)}">Copy</button>`;
function wireCopy(root) {
  root.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Copied"; } catch { b.textContent = "Select + Ctrl+C"; }
    setTimeout(() => b.textContent = "Copy", 1500);
  });
}
function pageMsg(t, bad) { const e = $("pageMsg"); if (e) { e.textContent = t; e.className = "status " + (bad ? "badtxt" : "ok"); } }

function setView(v) {

async function refresh() {

function idFrom(text) { return (text || "").toLowerCase().replace(/[^a-z0-9_-]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 32); }
const WORLD_NAMES = { chernarusplus: "Chernarus", enoch: "Livonia", sakhal: "Sakhal" };

        <td>${esc(s.lanHost || "-")}${s.publicHost ? " / " + esc(s.publicHost) : ""}</td><td>${s.port}${s.queryPort ? ` <span class="hint">q ${s.queryPort}</span>` : ""}</td></tr>`;

  }
}

// ---------- Travel rules (per server, for trips that START there) ----------
const TRAVEL_FIELDS = [
  ["foodFootPct", "Food on foot", "% per 10 km"], ["waterFootPct", "Water on foot", "% per 10 km"],
  ["foodCarPct", "Food by car", "% per 10 km, each person"], ["waterCarPct", "Water by car", "% per 10 km, each person"],
  ["fuelLiters", "Fuel", "litres per 10 km"], ["wearEnginePct", "Engine wear", "% health per 10 km"], ["wearWheelsPct", "Wheel wear", "% health per 10 km, every wheel"],
  ["speedFootKmh", "Speed on foot", "km/h (travel time)"], ["speedCarKmh", "Speed by car", "km/h (travel time)"],
  ["luckGasPct", "Find fuel when out", "% chance (weakened)"], ["biteDeathPct", "Attack kills", "% of attacks (weakened)"],
  ["bitePct", "Infected attack", "% per 10 km walked (weakened)"], ["starveDeathPct", "Starve / thirst kills", "% when over half short (weakened)"],
];
function travelBox(f) {
  const t = f.travel || {};
  return `<div class="box"><h2>Travel from ${esc(f.name)}</h2>
    <div class="hint">Costs for trips that START on this server, per 10 km of the zone's distance (set on the Map page; 0 km = free + instant). Food and water are % of a full bar. <b>Saved now, charged in game from the next build step.</b></div>
    <div class="grid2" style="margin-top:6px">
      <div><label>When a player is short of food, water or fuel</label><select id="tMode"><option value="refuse" ${t.mode !== "weakened" ? "selected" : ""}>Refuse the trip</option><option value="weakened" ${t.mode === "weakened" ? "selected" : ""}>Travel anyway, arrive weakened (the road decides)</option></select></div>
      <div><label>Travel time</label><select id="tTime"><option value="0" ${!t.timeEnabled ? "selected" : ""}>Off: arrive at once</option><option value="1" ${t.timeEnabled ? "selected" : ""}>On: on the road for distance / speed, no login anywhere meanwhile</option></select></div>
    </div>
    <div class="grid3">${TRAVEL_FIELDS.map(([k, label, unit]) => `<div><label>${label} <span class="hint">(${unit})</span></label><input id="t_${k}" type="number" step="0.5" min="0" value="${t[k] ?? 0}"></div>`).join("")}</div>
    <div class="btns"><button class="primary" id="tSave">Save travel rules</button></div><div class="status" id="tMsg"></div></div>`;
}
function wireTravel(f) {
  const b = $("tSave");
  if (!b) return;
  b.onclick = async () => {
    const t = { mode: $("tMode").value, timeEnabled: $("tTime").value === "1" };
    TRAVEL_FIELDS.forEach(([k]) => t[k] = +$("t_" + k).value);
    try {
      const out = await post(`/admin/api/servers/${encodeURIComponent(f.id)}/travel`, t);
      f.travel = out.travel; await refresh();
      const m = $("tMsg"); m.textContent = `Saved. ${f.name} picks it up within ~30 s.`; m.className = "status ok";
    } catch (e) { const m = $("tMsg"); m.textContent = e.message; m.className = "status badtxt"; }
  };
}

function renderFirewall(msg, bad) {
  const e = $("fwBody");
  if (!e || !fw) return;
  if (!fw.windows) { e.innerHTML = "This hub is not running on Windows: open the ports below in your system's firewall."; return; }
  const missing = fw.rules.filter(r => !r.present).length;
  let h = `<div class="hint">Rules for the hub and the DayZ servers on <b>this PC</b>.${missing ? " Applying needs administrator rights: Windows asks once on this PC." : ""}</div><table style="margin-top:6px"><tr><th>Rule</th><th>Ports</th><th>For</th><th></th></tr>`;
  fw.rules.forEach(r => h += `<tr><td>${esc(r.name)}</td><td>${r.proto} ${esc(r.ports)}</td><td class="hint">${esc(r.why)}</td><td class="${r.present ? "ok" : "warn"}">${r.present ? "✓ open" : "missing"}</td></tr>`);
  h += `</table><div class="btns">${missing ? `<button class="primary" id="fwApply">Apply firewall rules</button>` : `<span class="ok">All open.</span>`}<button id="fwRe">Check again</button></div>`;
  if (msg) h += `<div class="status ${bad ? "badtxt" : "ok"}">${esc(msg)}</div>`;
  if (missing) h += `<details style="margin-top:8px"><summary class="hint">Or run these in an administrator terminal</summary><pre>${copyBtn(fw.commands.join("\n"))}${esc(fw.commands.join("\n"))}</pre></details>`;
  if (fw.remote.length) {
    h += `<div style="margin-top:12px"><b>DayZ servers on other PCs</b> <span class="hint">- the hub can't reach their firewall: run this on that PC in an administrator PowerShell</span></div>`;
    fw.remote.forEach(r => h += `<label>${esc(r.name)}${r.seen ? ` (at ${esc(r.seen)})` : ""}</label><pre>${copyBtn(r.powershell)}${esc(r.powershell)}</pre>`);
  }
  h += `<div class="hint" style="margin-top:10px">Players or servers coming from the internet also need these ports forwarded on your router (UDP game ports to each DayZ server PC, TCP ${S.hub.httpPort || 7290} to this hub); routers can't be set from here.</div>`;
  e.innerHTML = h;
  wireCopy(e);
  const a = $("fwApply");
  if (a) a.onclick = async () => {
    a.disabled = true; a.textContent = "Waiting for Windows…";
    try { fw = await post("/admin/api/firewall/apply"); renderFirewall(fw.message, !fw.ok); } catch (x) { renderFirewall(x.message, true); }
  };
  $("fwRe").onclick = () => loadFirewall();
}

async function loadFirewall() {
  try { const r = await fetch("/admin/api/firewall", { cache: "no-store" }); fw = await r.json(); renderFirewall(); }
  catch (e) { const el = $("fwBody"); if (el) el.textContent = "Could not check: " + e.message; }
}

// ---------- Players ----------
let players = [], playerSel = null, playerQ = "";
const srvName = id => { const s = S.servers.find(x => x.id === id); return s ? s.name : id; };
const since = t => { if (!t) return ""; const d = (Date.now() - Date.parse(t.replace(" ", "T") + "Z")) / 1000; return d < 90 ? "just now" : d < 3600 ? `${Math.round(d / 60)} min ago` : d < 86400 ? `${Math.round(d / 3600)} h ago` : `${Math.round(d / 86400)} d ago`; };
function whereText(p) {
  if (p.pending) return `<span class="warn">travelling ${esc(srvName(p.pending.from))} → ${esc(srvName(p.pending.to))}</span>${p.pending.failCount ? ` <span class="badtxt">(failed ${p.pending.failCount}x)</span>` : ""}`;
  if (p.owner) return `<span class="ok">${esc(srvName(p.owner))}</span>`;
  return `<span class="hint">not assigned (next login anywhere)</span>`;
}

async function loadPlayers() {
  const r = await fetch(`/admin/api/players?q=${encodeURIComponent(playerQ)}`, { cache: "no-store" });
  players = (await r.json()).players || [];
}

async function renderPlayers() {
  const b = $("pageBody");
  if (!$("plQ")) {
    b.innerHTML = `<h2 class="big">Players</h2>
      <div class="box"><input id="plQ" placeholder="Search by name or steam id" value="${esc(playerQ)}"><div id="plList" style="margin-top:8px"></div></div>
      <div id="plDetail"></div>`;
    let t = null;
    $("plQ").oninput = e => { clearTimeout(t); t = setTimeout(async () => { playerQ = e.target.value; await loadPlayers(); drawPlayerList(); }, 250); };
  }
  await loadPlayers();
  drawPlayerList();
  if (playerSel) showPlayer(playerSel);
}

function drawPlayerList() {
  const el = $("plList");
  if (!el) return;
  if (!players.length) { el.innerHTML = `<div class="hint">${playerQ ? "Nobody matches." : "No players yet: the hub learns a player the first time he logs in on a DriveLink server."}</div>`; return; }
  el.innerHTML = `<table><tr><th>Player</th><th>Character is on</th><th>Last login</th><th>Trips</th></tr>${players.map((p, i) => `
    <tr class="click ${p.steamId === playerSel ? "sel" : ""}" data-pl="${i}"><td><b>${esc(p.name || "(name not sent yet)")}</b><div class="hint">${esc(p.steamId)}</div></td>
    <td>${whereText(p)}</td><td>${p.lastLogin ? `${esc(srvName(p.lastServer))} <span class="hint">${since(p.lastLogin)}</span>` : `<span class="hint">-</span>`}</td><td>${p.trips}</td></tr>`).join("")}</table>`;
  el.querySelectorAll("[data-pl]").forEach(x => x.onclick = () => { playerSel = players[+x.dataset.pl].steamId; drawPlayerList(); showPlayer(playerSel); });
}

async function showPlayer(sid) {
  const box = $("plDetail");
  const r = await fetch(`/admin/api/players/${encodeURIComponent(sid)}`, { cache: "no-store" });
  if (!r.ok) { box.innerHTML = `<div class="box badtxt">${esc(await r.text())}</div>`; return; }
  const p = await r.json();
  const pend = p.trips.find(t => t.state === "pending");
  const opts = S.servers.map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("");
  const sn = p.snapshot;
  let h = `<div class="box"><h2>${esc(p.name || p.steamId)}</h2>
    <div class="grid3">
      <div><label>Steam id</label><div>${esc(p.steamId)} ${copyBtn(p.steamId)}</div></div>
      <div><label>Character is on</label><div>${pend ? `<span class="warn">travelling ${esc(srvName(pend.from))} → ${esc(srvName(pend.to))}</span>` : p.owner ? `<span class="ok">${esc(srvName(p.owner))}</span>` : `<span class="hint">not assigned</span>`}</div></div>
      <div><label>Last login</label><div>${p.lastLogin ? `${esc(srvName(p.lastServer))}, ${since(p.lastLogin)}` : "-"}</div></div>
    </div>`;
  if (pend && pend.failCount) h += `<div class="badtxt" style="margin-top:8px">The target failed to build him ${pend.failCount}x: ${esc(pend.lastError || "")}</div>`;
  h += `<h2 style="margin-top:14px">Fix</h2>`;
  if (pend) {
    h += `<div class="hint">A trip is waiting: his gear is in it. Send it to another server (he arrives there at its first arrival point next time he joins), or throw it away.</div>
      <div class="btns"><select id="plSrv" style="width:auto">${opts}</select><button class="primary" id="plSend">Send the trip there</button><button class="danger" id="plDrop">Drop the trip</button></div>`;
  } else {
    h += `<div class="hint">Assign = that server holds his character from now on: joining any other server sends him there. Use it when his character really is on that server (its own save). Release = the hub forgets: his next login anywhere is a normal one there.</div>
      <div class="btns"><select id="plSrv" style="width:auto">${opts}</select><button class="primary" id="plAssign">Assign to this server</button><button id="plRelease">Release</button></div>`;
  }
  h += `<div class="status" id="plMsg"></div>`;
  if (sn && !sn.error) {
    h += `<h2 style="margin-top:14px">Snapshot <span class="hint" style="text-transform:none">(${esc(sn.from)})</span></h2>
      <div class="grid3"><div><label>Character</label>${esc(sn.charType || "?")}</div><div><label>Health / blood</label>${Math.round(sn.health)} / ${Math.round(sn.blood)}</div><div><label>Water / food</label>${Math.round(sn.water)} / ${Math.round(sn.energy)}</div>
      <div><label>Items</label>${sn.items}</div><div><label>Bleeding</label>${sn.bleeding}${sn.restrained ? ", cuffed" : ""}</div><div><label>Car</label>${sn.car ? `${esc(sn.car.type)} (${sn.car.parts} parts${sn.car.fuel != null ? ", fuel " + Math.round(sn.car.fuel * 100) + "%" : ""})` : sn.passengerOf ? "passenger" : "on foot"}</div></div>
      <details style="margin-top:8px"><summary class="hint">Items (${sn.items})</summary><div style="columns:3;font-size:12px;margin-top:6px">${sn.itemTypes.map(t => `<div>${t.n > 1 ? t.n + "× " : ""}${esc(t.type)}</div>`).join("")}</div></details>`;
  } else if (sn && sn.error) h += `<div class="badtxt">${esc(sn.error)}</div>`;
  h += `<h2 style="margin-top:14px">Trips</h2>${p.trips.length ? `<table><tr><th>When</th><th>From → to</th><th>State</th><th>Size</th></tr>${p.trips.map(t => `<tr><td>${esc(t.at)} <span class="hint">UTC</span></td><td>${esc(srvName(t.from))} → ${esc(srvName(t.to))}${t.arrival ? ` <span class="hint">(${esc(t.arrival)})</span>` : ""}</td><td class="${t.state === "claimed" ? "ok" : t.state === "pending" ? "warn" : "hint"}">${t.state === "claimed" ? "arrived" : t.state === "pending" ? "waiting" : esc(t.state)}${t.failCount ? ` <span class="badtxt">failed ${t.failCount}x</span>` : ""}</td><td class="hint">${Math.round(t.bytes / 1024)} kB</td></tr>`).join("")}</table>` : `<div class="hint">none</div>`}`;
  if (p.log.length) h += `<h2 style="margin-top:14px">Admin changes</h2>${p.log.map(l => `<div class="hint">${esc(l.at)} UTC - ${esc(l.detail)}</div>`).join("")}`;
  h += `</div>`;
  box.innerHTML = h;
  wireCopy(box);
  const act = async (action, sure) => {
    const server = $("plSrv") ? $("plSrv").value : "";
    if (!confirm(sure.replace("{srv}", srvName(server)))) return;
    try {
      const out = await post(`/admin/api/players/${encodeURIComponent(sid)}/action`, { action, server });
      await loadPlayers(); drawPlayerList(); await showPlayer(sid);
      const m = $("plMsg"); if (m) { m.textContent = "Done: " + out.detail; m.className = "status ok"; }
    } catch (e) { const m = $("plMsg"); if (m) { m.textContent = e.message; m.className = "status badtxt"; } }
  };
  const on = (id, f) => { const e = $(id); if (e) e.onclick = f; };
  on("plSend", () => act("send", "Send his waiting trip to {srv}? He arrives there (first arrival point) with the gear in the trip when he next joins."));
  on("plDrop", () => act("drop", "Drop the waiting trip? The gear in it is LOST: the character on the server he left was already removed."));
  on("plAssign", () => act("assign", "Assign him to {srv}? Joining any other server sends him there. If he is online somewhere else right now, he can't travel until he logs out."));
  on("plRelease", () => act("release", "Release him? His next login on ANY server is a normal login (that server's own save of him, or a fresh spawn)."));
}

// keep Servers status fresh (join requests appear by themselves)
setInterval(async () => {
  if (view !== "servers" || editing) return;
  try { await refresh(); renderServers(); } catch {}
}, 5000);

(async () => {
  try {
    await refresh();
    let v = null;
    try { v = localStorage.getItem("dlView"); } catch {}
    if (!S.servers.length || S.pending.length) v = "servers";
    setView(v || "map");
  } catch (e) { $("pageBody").textContent = "Could not load: " + e.message; $("page").style.display = "block"; $("app").style.display = "none"; }
})();
</script>
</body>
</html>
