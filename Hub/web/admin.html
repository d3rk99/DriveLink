<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DriveLink Map Editor</title>
<link rel="stylesheet" href="/admin/vendor/leaflet.css">
<style>
  :root { --bg:#14171a; --panel:#1d2126; --line:#2c323a; --text:#e6e8eb; --dim:#9aa3ad; --accent:#4fb3ff; --zone:#ff8a3d; --arr:#45d483; --bad:#ff5d5d; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, Segoe UI, sans-serif; }
  #app { display:flex; height:100%; }
  #side { width:340px; min-width:300px; background:var(--panel); border-right:1px solid var(--line); overflow:auto; padding:14px; }
  #map { flex:1; background:#0b0d0f; }
  h1 { font-size:16px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:12px; }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .tab { padding:6px 10px; border:1px solid var(--line); border-radius:6px; cursor:pointer; background:transparent; color:var(--text); }
  .tab.on { border-color:var(--accent); color:var(--accent); background:transparent; }
  .tools { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:8px 0 12px; }
  button { font:inherit; padding:7px 10px; border-radius:6px; border:1px solid var(--line); background:#262b31; color:var(--text); cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.on { background:var(--accent); color:#06121c; border-color:var(--accent); }
  button.danger { color:var(--bad); }
  .box { border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:12px; }
  .box h2 { font-size:13px; margin:0 0 8px; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; }
  label { display:block; font-size:12px; color:var(--dim); margin:6px 0 2px; }
  input, select { width:100%; font:inherit; padding:6px 8px; border-radius:6px; border:1px solid var(--line); background:#14171a; color:var(--text); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .item { display:flex; justify-content:space-between; align-items:center; padding:5px 6px; border-radius:6px; cursor:pointer; }
  .item:hover, .item.sel { background:#262b31; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:6px; }
  .status { font-size:12px; color:var(--dim); min-height:16px; }
  .hint { font-size:12px; color:var(--dim); }
  .arrow-icon { width:28px; height:28px; }
  .handle { width:14px; height:14px; border-radius:50%; background:#fff; border:3px solid var(--accent); }
  .leaflet-container { background:#0b0d0f; }
  .lbl { background:rgba(0,0,0,.65); color:#fff; border:none; box-shadow:none; font-size:12px; }
  .lbl:before { display:none; }
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <h1>DriveLink map editor</h1>
    <div class="sub">Leaving zones and arrival points. Changes are saved at once and reach the DayZ server within ~30 s. Heights come from the terrain.</div>
    <div class="tabs" id="tabs"></div>
    <div class="box" id="mapbox"></div>
    <div class="tools">
      <button id="tZone" title="Click the centre, drag out the radius">+ Leaving zone</button>
      <button id="tArr" title="Click the spot, drag the way they face">+ Arrival point</button>
    </div>
    <div class="hint" id="toolHint">Pick a tool, or click a zone / point on the map to edit it.</div>
    <div class="box" id="edit" style="display:none"></div>
    <div class="box"><h2>Leaving zones</h2><div id="zlist"></div></div>
    <div class="box"><h2>Arrival points</h2><div id="alist"></div></div>
    <div class="status" id="status"></div>
  </div>
  <div id="map"></div>
</div>
<script src="/admin/vendor/leaflet.js"></script>
<script>
"use strict";
const SIZES = { chernarusplus: 15360, enoch: 12800, sakhal: 15360 };
let S = null, cur = null, map = null, tiles = null, layer = null, tool = null, sel = null, saveTimer = null, drawing = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const srv = () => S.servers.find(s => s.id === cur);
const L_of = s => s.layout;

async function load() {
  const r = await fetch("/admin/api/state", { cache: "no-store" });
  S = await r.json();
  if (!cur) cur = S.servers[0] && S.servers[0].id;
  render(true);
}

function setStatus(t, bad) { const e = $("status"); e.textContent = t; e.style.color = bad ? "var(--bad)" : ""; }

function render(rebuildMap) {
  $("tabs").innerHTML = S.servers.map(s => `<button class="tab ${s.id === cur ? "on" : ""}" data-id="${esc(s.id)}">${esc(s.name)}</button>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { cur = b.dataset.id; sel = null; render(true); });
  renderMapBox();
  if (rebuildMap) buildMap();
  drawLayout();
  renderLists();
  renderEdit();
}

function renderMapBox() {
  const s = srv(), m = S.maps[s.map] || {};
  const opts = Object.keys(S.maps).map(k => `<option value="${esc(k)}" ${k === s.map ? "selected" : ""}>${esc(k)}</option>`).join("");
  let line;
  if (m.meta) line = `Map ready (${Math.round(m.meta.size)} m).`;
  else if (m.status && !/^(ready|FAILED)/.test(m.status)) line = `Building: ${esc(m.status)}`;
  else if (m.inGameFiles && S.tools) line = `No map image yet. <button id="build">Build from game files</button>`;
  else if (m.inGameFiles) line = `DayZ Tools not found (install it from Steam).`;
  else line = `No game files for this map found - a grid is shown.`;
  if (m.status && /^FAILED/.test(m.status)) line += `<div style="color:var(--bad)">${esc(m.status)}</div>`;
  $("mapbox").innerHTML = `<h2>Map</h2><select id="mapSel">${opts || `<option>${esc(s.map || "?")}</option>`}</select><div class="hint" style="margin-top:6px">${line}</div>`;
  $("mapSel").onchange = e => { s.map = e.target.value; save(); render(true); };
  const b = $("build");
  if (b) b.onclick = async () => { await fetch(`/admin/api/maps/${encodeURIComponent(s.map)}/build`, { method: "POST" }); pollBuild(); };
}

function pollBuild() {
  const s = srv();
  setTimeout(async () => {
    const r = await fetch("/admin/api/state", { cache: "no-store" });
    const n = await r.json();
    S.maps = n.maps;
    const m = S.maps[s.map] || {};
    renderMapBox();
    if (m.meta) buildMap(); else if (m.status && !/^(ready|FAILED)/.test(m.status)) pollBuild();
    if (m.meta) drawLayout();
  }, 1500);
}

function buildMap() {
  const s = srv(), m = S.maps[s.map] || {};
  const size = (m.meta && m.meta.size) || SIZES[s.map] || 15360;
  if (map) { map.remove(); map = null; }
  const crs = L.extend({}, L.CRS.Simple, { transformation: new L.Transformation(1, 0, -1, size) });
  map = L.map("map", { crs, minZoom: m.meta ? m.meta.minZoom : -6, maxZoom: 3, zoomSnap: 0.25, attributionControl: false, boxZoom: false });
  const bounds = [[0, 0], [size, size]];
  if (m.meta) {
    tiles = L.tileLayer(`/admin/maps/${encodeURIComponent(s.map)}/{z}/{x}_{y}.jpg`, { tileSize: m.meta.tileSize, minNativeZoom: m.meta.minZoom, maxNativeZoom: 0, minZoom: m.meta.minZoom, maxZoom: 3, noWrap: true, bounds }).addTo(map);
  } else {
    const g = [];
    for (let v = 0; v <= size; v += 1000) { g.push([[v, 0], [v, size]]); g.push([[0, v], [size, v]]); }
    L.polyline(g, { color: "#2c323a", weight: 1, interactive: false }).addTo(map);
  }
  L.rectangle(bounds, { color: "#3a414a", weight: 1, fill: false, interactive: false }).addTo(map);
  map.fitBounds(bounds);
  const pos = L.control({ position: "bottomleft" });
  pos.onAdd = () => { const d = L.DomUtil.create("div", "lbl leaflet-tooltip"); d.id = "pos"; d.style.position = "static"; return d; };
  pos.addTo(map);
  map.on("mousemove", e => { const p = $("pos"); if (p) p.textContent = `x ${e.latlng.lng.toFixed(1)}   z ${e.latlng.lat.toFixed(1)}`; });
  map.on("mousedown", startDraw);
  map.on("mousemove", moveDraw);
  map.on("mouseup", endDraw);
  layer = L.layerGroup().addTo(map);
}

// ---------- drawing ----------
const yawOf = (from, to) => ((Math.atan2(to.lng - from.lng, to.lat - from.lat) * 180 / Math.PI) + 360) % 360;
const dist = (a, b) => Math.hypot(a.lng - b.lng, a.lat - b.lat);
const otherServers = () => S.servers.filter(s => s.id !== cur);

function setTool(t) {
  tool = tool === t ? null : t;
  $("tZone").classList.toggle("on", tool === "zone");
  $("tArr").classList.toggle("on", tool === "arr");
  $("toolHint").textContent = tool === "zone" ? "Click the centre of the zone and drag out its radius." : tool === "arr" ? "Click where players arrive and drag the way they face." : "Pick a tool, or click a zone / point on the map to edit it.";
  if (map) tool ? map.dragging.disable() : map.dragging.enable();
}
$("tZone").onclick = () => setTool("zone");
$("tArr").onclick = () => setTool("arr");

function startDraw(e) {
  if (!tool) return;
  drawing = { kind: tool, start: e.latlng, shape: null };
  if (tool === "zone") drawing.shape = L.circle(e.latlng, { radius: 1, color: "#ff8a3d" }).addTo(map);
  else drawing.shape = L.polyline([e.latlng, e.latlng], { color: "#45d483", weight: 3 }).addTo(map);
}
function moveDraw(e) {
  if (!drawing) return;
  if (drawing.kind === "zone") drawing.shape.setRadius(Math.max(1, dist(drawing.start, e.latlng)));
  else drawing.shape.setLatLngs([drawing.start, e.latlng]);
}
function endDraw(e) {
  if (!drawing) return;
  const d = drawing; drawing = null; map.removeLayer(d.shape);
  const L1 = L_of(srv());
  if (d.kind === "zone") {
    const to = otherServers()[0];
    const toArr = to && to.layout.arrivals[0];
    const z = { name: `To ${to ? to.name : "?"}`, center: [d.start.lng, 0, d.start.lat], radius: Math.max(5, Math.round(dist(d.start, e.latlng))), to: to ? to.id : "", arrival: toArr ? toArr.name : "" };
    L1.zones.push(z); sel = { kind: "zone", i: L1.zones.length - 1 };
  } else {
    const yaw = dist(d.start, e.latlng) > 1 ? yawOf(d.start, e.latlng) : 0;
    const a = { name: `arrival_${L1.arrivals.length + 1}`, pos: [d.start.lng, 0, d.start.lat], yaw: Math.round(yaw), carPos: [0, 0, 0], carYaw: 0 };
    L1.arrivals.push(a); sel = { kind: "arr", i: L1.arrivals.length - 1 };
  }
  setTool(null);
  save(); drawLayout(); renderLists(); renderEdit();
}

// ---------- show the layout ----------
function arrowIcon(yaw, color) {
  return L.divIcon({ className: "", iconSize: [28, 28], iconAnchor: [14, 14],
    html: `<svg class="arrow-icon" viewBox="0 0 28 28" style="transform:rotate(${yaw}deg)"><circle cx="14" cy="14" r="6" fill="${color}" stroke="#000" stroke-width="1.5"/><path d="M14 1 L19 10 L9 10 Z" fill="${color}" stroke="#000" stroke-width="1"/></svg>` });
}
const handleIcon = L.divIcon({ className: "", iconSize: [14, 14], iconAnchor: [7, 7], html: `<div class="handle"></div>` });

function drawLayout() {
  if (!layer) return;
  layer.clearLayers();
  const L1 = L_of(srv());
  L1.zones.forEach((z, i) => {
    const on = sel && sel.kind === "zone" && sel.i === i;
    const c = L.circle([z.center[2], z.center[0]], { radius: z.radius, color: "#ff8a3d", weight: on ? 3 : 2, fillOpacity: on ? .25 : .15 }).addTo(layer);
    c.bindTooltip(`${esc(z.name)} → ${esc(z.to)}`, { permanent: true, direction: "center", className: "lbl" });
    c.on("click", ev => { if (tool) return; L.DomEvent.stop(ev); sel = { kind: "zone", i }; drawLayout(); renderLists(); renderEdit(); });
    if (on) {
      const ctr = L.marker([z.center[2], z.center[0]], { draggable: true, icon: handleIcon }).addTo(layer);
      const rad = L.marker([z.center[2], z.center[0] + z.radius], { draggable: true, icon: handleIcon }).addTo(layer);
      ctr.on("drag", e => { const p = e.target.getLatLng(); c.setLatLng(p); rad.setLatLng([p.lat, p.lng + z.radius]); });
      ctr.on("dragend", e => { const p = e.target.getLatLng(); z.center = [p.lng, 0, p.lat]; save(); renderEdit(); drawLayout(); });
      rad.on("drag", e => c.setRadius(Math.max(1, dist(c.getLatLng(), e.target.getLatLng()))));
      rad.on("dragend", e => { z.radius = Math.max(1, Math.round(dist(c.getLatLng(), e.target.getLatLng()))); save(); renderEdit(); drawLayout(); });
    }
  });
  L1.arrivals.forEach((a, i) => {
    const on = sel && sel.kind === "arr" && sel.i === i;
    const ll = [a.pos[2], a.pos[0]];
    const m = L.marker(ll, { icon: arrowIcon(a.yaw, "#45d483"), draggable: on, zIndexOffset: 500 }).addTo(layer);
    m.bindTooltip(esc(a.name), { permanent: true, direction: "right", offset: [12, 0], className: "lbl" });
    m.on("click", ev => { if (tool) return; L.DomEvent.stop(ev); sel = { kind: "arr", i }; drawLayout(); renderLists(); renderEdit(); });
    if (on) {
      const r = Math.max(15, 2 ** (-map.getZoom()) * 40);
      const rad = a.yaw * Math.PI / 180;
      const head = L.marker([a.pos[2] + Math.cos(rad) * r, a.pos[0] + Math.sin(rad) * r], { draggable: true, icon: handleIcon }).addTo(layer);
      const line = L.polyline([ll, head.getLatLng()], { color: "#45d483", weight: 2, dashArray: "4 4", interactive: false }).addTo(layer);
      m.on("drag", e => line.setLatLngs([e.target.getLatLng(), head.getLatLng()]));
      m.on("dragend", e => { const p = e.target.getLatLng(); a.pos = [p.lng, a.pos[1], p.lat]; save(); renderEdit(); drawLayout(); });
      head.on("drag", e => { line.setLatLngs([m.getLatLng(), e.target.getLatLng()]); m.setIcon(arrowIcon(yawOf(m.getLatLng(), e.target.getLatLng()), "#45d483")); });
      head.on("dragend", e => { a.yaw = Math.round(yawOf(m.getLatLng(), e.target.getLatLng())); save(); renderEdit(); drawLayout(); });
    }
  });
}

function renderLists() {
  const L1 = L_of(srv());
  $("zlist").innerHTML = L1.zones.map((z, i) => `<div class="item ${sel && sel.kind === "zone" && sel.i === i ? "sel" : ""}" data-k="zone" data-i="${i}"><span><span class="dot" style="background:var(--zone)"></span>${esc(z.name)}</span><span class="hint">r ${Math.round(z.radius)} m → ${esc(z.to)}</span></div>`).join("") || `<div class="hint">none yet</div>`;
  $("alist").innerHTML = L1.arrivals.map((a, i) => `<div class="item ${sel && sel.kind === "arr" && sel.i === i ? "sel" : ""}" data-k="arr" data-i="${i}"><span><span class="dot" style="background:var(--arr)"></span>${esc(a.name)}</span><span class="hint">${Math.round(a.yaw)}°</span></div>`).join("") || `<div class="hint">none yet</div>`;
  document.querySelectorAll(".item").forEach(el => el.onclick = () => {
    sel = { kind: el.dataset.k, i: +el.dataset.i };
    const L2 = L_of(srv()), o = sel.kind === "zone" ? L2.zones[sel.i] : L2.arrivals[sel.i];
    const p = sel.kind === "zone" ? o.center : o.pos;
    map.setView([p[2], p[0]], Math.max(map.getZoom(), -1));
    drawLayout(); renderLists(); renderEdit();
  });
}

function renderEdit() {
  const box = $("edit");
  if (!sel) { box.style.display = "none"; return; }
  const L1 = L_of(srv());
  box.style.display = "";
  if (sel.kind === "zone") {
    const z = L1.zones[sel.i];
    if (!z) { sel = null; return renderEdit(); }
    const target = S.servers.find(s => s.id === z.to);
    const arrs = target ? target.layout.arrivals : [];
    box.innerHTML = `<h2>Leaving zone</h2>
      <label>Name (shown to players)</label><input id="fName" value="${esc(z.name)}">
      <div class="row"><div><label>x</label><input id="fX" type="number" step="0.1" value="${z.center[0].toFixed(1)}"></div><div><label>z</label><input id="fZ" type="number" step="0.1" value="${z.center[2].toFixed(1)}"></div></div>
      <label>Radius (m)</label><input id="fR" type="number" min="1" value="${Math.round(z.radius)}">
      <label>Sends players to</label><select id="fTo">${otherServers().map(s => `<option value="${esc(s.id)}" ${s.id === z.to ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select>
      <label>Arrival point there</label><select id="fArr">${arrs.map(a => `<option ${a.name === z.arrival ? "selected" : ""}>${esc(a.name)}</option>`).join("")}${arrs.length ? "" : `<option value="">(that server has no arrival points yet)</option>`}</select>
      <div style="margin-top:10px"><button class="danger" id="fDel">Delete zone</button></div>`;
    $("fName").oninput = e => { z.name = e.target.value; changed(); };
    $("fX").onchange = e => { z.center[0] = +e.target.value; changed(true); };
    $("fZ").onchange = e => { z.center[2] = +e.target.value; changed(true); };
    $("fR").onchange = e => { z.radius = Math.max(1, +e.target.value); changed(true); };
    $("fTo").onchange = e => { z.to = e.target.value; const t = S.servers.find(s => s.id === z.to); z.arrival = t && t.layout.arrivals[0] ? t.layout.arrivals[0].name : ""; changed(true); renderEdit(); };
    $("fArr").onchange = e => { z.arrival = e.target.value; changed(); };
    $("fDel").onclick = () => { L1.zones.splice(sel.i, 1); sel = null; changed(true); };
  } else {
    const a = L1.arrivals[sel.i];
    if (!a) { sel = null; return renderEdit(); }
    box.innerHTML = `<h2>Arrival point</h2>
      <label>Name (zones on other servers point here)</label><input id="fName" value="${esc(a.name)}">
      <div class="row"><div><label>x</label><input id="fX" type="number" step="0.1" value="${a.pos[0].toFixed(1)}"></div><div><label>z</label><input id="fZ" type="number" step="0.1" value="${a.pos[2].toFixed(1)}"></div></div>
      <label>Facing (degrees, 0 = north, 90 = east)</label><input id="fYaw" type="number" min="0" max="359" value="${Math.round(a.yaw)}">
      <div class="hint" style="margin-top:6px">A car that comes along is built here facing the same way; the driver stands 3 m to its left.</div>
      <div style="margin-top:10px"><button class="danger" id="fDel">Delete point</button></div>`;
    $("fName").oninput = e => { renameArrival(a, e.target.value); changed(); };
    $("fX").onchange = e => { a.pos[0] = +e.target.value; changed(true); };
    $("fZ").onchange = e => { a.pos[2] = +e.target.value; changed(true); };
    $("fYaw").onchange = e => { a.yaw = ((+e.target.value % 360) + 360) % 360; changed(true); };
    $("fDel").onclick = () => { L1.arrivals.splice(sel.i, 1); sel = null; changed(true); };
  }
}

// renaming an arrival point also fixes the zones on other servers that send players to it
let renameFrom = null;
function renameArrival(a, name) { renameFrom = renameFrom === null ? a.name : renameFrom; a.name = name; }

function changed(redraw) { save(); if (redraw) { drawLayout(); } renderLists(); }

function save() {
  clearTimeout(saveTimer);
  setStatus("Saving…");
  saveTimer = setTimeout(async () => {
    const s = srv(), list = [s];
    if (renameFrom !== null) {
      const newName = sel && sel.kind === "arr" ? L_of(s).arrivals[sel.i].name : null;
      S.servers.forEach(o => { if (o.id === s.id) return; let hit = false; o.layout.zones.forEach(z => { if (z.to === s.id && z.arrival === renameFrom && newName) { z.arrival = newName; hit = true; } }); if (hit) list.push(o); });
      renameFrom = null;
    }
    try {
      for (const t of list) {
        const r = await fetch(`/admin/api/layout/${encodeURIComponent(t.id)}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ map: t.map, zones: t.layout.zones, arrivals: t.layout.arrivals }) });
        if (!r.ok) throw new Error(await r.text());
        t.layout.rev = (await r.json()).rev;
      }
      setStatus(`Saved (rev ${s.layout.rev}). ${s.name} picks it up within ~30 s.`);
    } catch (e) { setStatus("Save failed: " + e.message, true); }
  }, 400);
}

load().catch(e => setStatus("Could not load: " + e.message, true));
</script>
</body>
</html>
