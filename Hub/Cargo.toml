[package]
name = "drivelink-hub"
version = "0.5.1"
edition = "2024"

[dependencies]
axum = "0.8.9"
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
chrono = "0.4.45"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rand = "0.10.3"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha2 = "0.11.1"
subtle = "2.6.1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
ureq = "3.5.0"
windows-service = "0.8.1"
